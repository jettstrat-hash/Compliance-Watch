[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliancewatch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sendgrid>=6.11.0",
    "stripe>=9.12.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
    "schedule>=1.2.0",
    "mjml>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["compliancewatch*"]
